name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pubblica Windows x64
        shell: pwsh
        run: ./scripts/build.ps1 -OutputPath ./artifacts/win-x64
      - name: Prepara pacchetto portabile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/package/scripts | Out-Null
          Copy-Item ./artifacts/win-x64/* ./artifacts/package -Recurse -Force
          Copy-Item ./scripts/install-ac-bridge.ps1 ./artifacts/package/scripts/ -Force
          Copy-Item ./README.md ./artifacts/package/ -Force
          Compress-Archive -Path ./artifacts/package/* -DestinationPath ./artifacts/AiRaceEngineer-win-x64.zip -CompressionLevel Optimal
      - name: Carica artefatto build
        uses: actions/upload-artifact@v4
        with:
          name: AiRaceEngineer-win-x64
          path: artifacts/AiRaceEngineer-win-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Scarica pacchetto
        uses: actions/download-artifact@v4
        with:
          name: AiRaceEngineer-win-x64
          path: artifacts
      - name: Pubblica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/AiRaceEngineer-win-x64.zip
